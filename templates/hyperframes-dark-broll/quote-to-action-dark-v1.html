<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","type":"string","label":"Eyebrow","default":"从判断到行动"},{"id":"quote_line_1","type":"string","label":"Quote line 1","default":"所谓发达虽命定"},{"id":"quote_line_2","type":"string","label":"Quote line 2","default":"亦有肯做功夫"},{"id":"boundary_label","type":"string","label":"Boundary label","default":"先看清"},{"id":"boundary_action","type":"string","label":"Boundary action","default":"认清局限"},{"id":"action_label","type":"string","label":"Action label","default":"再行动"},{"id":"action_action","type":"string","label":"Action action","default":"下笨功夫"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Quote to Action Dark B-roll</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .quote { position:absolute; left:0; top:190px; width:100%; font-size:54px; font-weight:800; line-height:1.35; color:#fffdf8; }
    .quote-line { display:block; }
    .steps { position:absolute; left:80px; right:80px; top:510px; display:grid; grid-template-columns:1fr 230px 1fr; align-items:center; gap:28px; }
    .step { height:170px; padding:34px 40px; display:flex; flex-direction:column; justify-content:center; }
    .arrow { position:relative; width:100%; height:10px; }
    .arrow::after { content:""; position:absolute; right:-8px; top:-14px; border-left:28px solid #67e8c7; border-top:18px solid transparent; border-bottom:18px solid transparent; }
  </style>
</head>
<body>
  <div id="quote-root" class="root" data-composition-id="quote-to-action-dark-v1" data-start="0" data-width="1920" data-height="1080" data-duration="7">
    <section id="quote-scene" class="clip" data-start="0" data-duration="7" data-track-index="1">
      <div class="stage"><div class="grain"></div></div>
      <main class="content">
        <div id="quote-eyebrow" class="eyebrow" data-var-text="eyebrow">从判断到行动</div>
        <div class="quote"><span id="quote-line-1" class="quote-line" data-var-text="quote_line_1">所谓发达虽命定</span><span id="quote-line-2" class="quote-line amber" data-var-text="quote_line_2">亦有肯做功夫</span></div>
        <div class="steps">
          <article id="boundary-step" class="step card"><div class="label" data-var-text="boundary_label">先看清</div><div class="big" data-var-text="boundary_action">认清局限</div></article>
          <div id="action-arrow" class="arrow sketch-line"></div>
          <article id="action-step" class="step card"><div class="label amber" data-var-text="action_label">再行动</div><div class="big" data-var-text="action_action">下笨功夫</div></article>
        </div>
      </main>
    </section>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from("#quote-eyebrow", { y: 24, opacity: 0, duration: .45, ease: "power3.out" }, .2)
      .from("#quote-line-1", { x: -70, opacity: 0, duration: .55, ease: "power3.out" }, .8)
      .from("#quote-line-2", { x: -70, opacity: 0, duration: .55, ease: "power3.out" }, 1.65)
      .from("#boundary-step", { y: 45, opacity: 0, duration: .55, ease: "power3.out" }, 3.0)
      .from("#action-arrow", { scaleX: 0, duration: .65, ease: "power2.out" }, 3.7)
      .from("#action-step", { scale: .75, opacity: 0, duration: .55, ease: "back.out(1.6)" }, 4.35);
    window.__timelines["quote-to-action-dark-v1"] = tl;
  </script>
</body>
</html>
