interface:
  display_name: "知识 A/B-roll 成片"
  short_description: "把 SRT、MP3 或现有 ChatCut 项目制作成 A/B-roll 知识视频"
  default_prompt: "使用 $knowledge-abroll-video，根据我的输入、已有项目和审核授权完成所需阶段：未指定且无已有规格时默认横屏 1920x1080、16:9、30fps；先理解内容并确定 A/B 叙事职责，再设计画面、动作和旁白节拍，逐镜选工具；完整视频默认在 ChatCut 组装并导出，画风取自本片 DESIGN，按实际画面、音画同步与可编辑工程验收。"
